<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>المعلم الذكي - الحقيقي</title>
  
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0f172a" />

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap');
    body { font-family: 'Tajawal', sans-serif; }
    .chat-bubble-ai { background-color: #1e293b; border: 1px solid #334155; border-radius: 1rem 1rem 0.25rem 1rem; }
    .chat-bubble-user { background-color: #2563eb; border-radius: 1rem 1rem 1rem 0.25rem; }
    .active-nav { color: #3b82f6; border-top: 2px solid #3b82f6; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

  <!-- الهيدر -->
  <header class="bg-slate-800 p-4 border-b border-slate-700 flex justify-between items-center">
    <div class="flex items-center gap-2">
      <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center font-bold text-xl">🎓</div>
      <div>
        <h1 class="font-bold text-lg leading-none">المعلم الذكي</h1>
        <span class="text-xs text-blue-400">مدعوم بـ Gemini AI الحقيقي</span>
      </div>
    </div>
    <button onclick="clearChat()" class="text-xs text-slate-400 hover:text-rose-400 p-2"><i class="fa-solid fa-trash-can"></i></button>
  </header>

  <!-- محتوى الدردشة -->
  <main class="flex-1 p-4 max-w-md mx-auto w-full pb-24">
    <section id="ai-chat-section" class="space-y-4">
      <div id="chatContainer" class="space-y-3 min-h-[350px] max-h-[60vh] overflow-y-auto p-1">
        <div class="flex gap-2 items-start">
          <div class="w-7 h-7 rounded-full bg-blue-600 flex items-center justify-center text-xs font-bold shrink-0">AI</div>
          <div class="chat-bubble-ai p-3 text-xs text-slate-200 max-w-[85%] leading-relaxed">
            أهلاً بك يا أحمد! أنا معلمك الذكي متصل الآن بـ Gemini AI مباشرة. اسألني عن أي شيء وسأجيبك بإجابة دقيقة وحقيقية! 🧠
          </div>
        </div>
      </div>

      <!-- إدخال السؤال -->
      <div class="sticky bottom-20 bg-slate-900/90 pt-2">
        <form onsubmit="askGeminiAI(event)" class="flex gap-2">
          <input type="text" id="userInput" placeholder="اكتب سؤالك هنا..." class="flex-1 bg-slate-800 border border-slate-700 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-blue-500" />
          <button type="submit" id="sendBtn" class="bg-blue-600 text-white font-bold px-4 rounded-xl text-xs flex items-center justify-center gap-1">
            <span>إرسال</span>
            <i class="fa-solid fa-paper-plane"></i>
          </button>
        </form>
      </div>
    </section>

    <!-- معمل النطق -->
    <section id="phonics-section" class="hidden space-y-4">
      <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700">
        <h2 class="text-lg font-bold mb-2 text-emerald-400"><i class="fa-solid fa-volume-high"></i> نطق الحروف والكلمات</h2>
        <input type="text" id="speechText" placeholder="اكتب الكلمة للاستماع لنطقها..." class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs text-center text-white mb-3" />
        <div class="grid grid-cols-2 gap-2">
          <button onclick="speakInput('en')" class="bg-emerald-600 text-white font-bold py-3 rounded-xl text-xs">🔊 نطق إنجليزي</button>
          <button onclick="speakInput('ar')" class="bg-indigo-600 text-white font-bold py-3 rounded-xl text-xs">🔊 نطق عربي</button>
        </div>
      </div>
    </section>
  </main>

  <!-- التنقل -->
  <nav class="bg-slate-800 border-t border-slate-700 fixed bottom-0 left-0 right-0 max-w-md mx-auto flex justify-around p-2 text-center text-slate-400 text-xs">
    <button onclick="switchTab('chat')" id="nav-chat" class="flex-1 py-1 flex flex-col items-center gap-1 active-nav"><i class="fa-solid fa-comments text-lg"></i><span>المعلم الذكي</span></button>
    <button onclick="switchTab('phonics')" id="nav-phonics" class="flex-1 py-1 flex flex-col items-center gap-1"><i class="fa-solid fa-volume-high text-lg"></i><span>نطق الحروف</span></button>
  </nav>

  <script>
    function switchTab(tab) {
      document.getElementById('ai-chat-section').classList.add('hidden');
      document.getElementById('phonics-section').classList.add('hidden');
      document.getElementById('nav-chat').classList.remove('active-nav');
      document.getElementById('nav-phonics').classList.remove('active-nav');

      if(tab === 'chat') {
        document.getElementById('ai-chat-section').classList.remove('hidden');
        document.getElementById('nav-chat').classList.add('active-nav');
      } else {
        document.getElementById('phonics-section').classList.remove('hidden');
        document.getElementById('nav-phonics').classList.add('active-nav');
      }
    }

    async function askGeminiAI(e) {
      e.preventDefault();
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if(!text) return;

      const container = document.getElementById('chatContainer');
      container.innerHTML += `
        <div class="flex gap-2 items-start justify-end">
          <div class="chat-bubble-user p-3 text-xs text-white max-w-[85%] leading-relaxed">${text}</div>
        </div>
      `;

      input.value = '';
      container.scrollTop = container.scrollHeight;

      // إضافة مؤشر جاري التفكير
      const loadingId = 'loading-' + Date.now();
      container.innerHTML += `
        <div id="${loadingId}" class="flex gap-2 items-start">
          <div class="w-7 h-7 rounded-full bg-blue-600 flex items-center justify-center text-xs font-bold shrink-0">AI</div>
          <div class="chat-bubble-ai p-3 text-xs text-slate-400">جاري التفكير والإجابة...</div>
        </div>
      `;
      container.scrollTop = container.scrollHeight;

      try {
        // الاتصال المباشر بـ Gemini API
        const response = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=YOUR_GEMINI_API_KEY', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: "أنت معلم لغوي وتعليمي ذكي ومحترف. أجب عن سؤال الطالب التالي بإجابة دقيقة، صحيحة، ومباشرة باللغة العربية:\n" + text }] }]
          })
        });

        const data = await response.json();
        document.getElementById(loadingId).remove();

        let aiReply = "عذراً، حدث خطأ في الاتصال بالذكاء الاصطناعي. يرجى التأكد من إضافة مفتاح Gemini API الخاص بك.";
        if (data.candidates && data.candidates[0].content.parts[0].text) {
          aiReply = data.candidates[0].content.parts[0].text.replace(/\n/g, '<br/>');
        }

        container.innerHTML += `
          <div class="flex gap-2 items-start">
            <div class="w-7 h-7 rounded-full bg-blue-600 flex items-center justify-center text-xs font-bold shrink-0">AI</div>
            <div class="chat-bubble-ai p-3 text-xs text-slate-200 max-w-[85%] leading-relaxed">${aiReply}</div>
          </div>
        `;
      } catch (err) {
        document.getElementById(loadingId).remove();
        container.innerHTML += `
          <div class="flex gap-2 items-start">
            <div class="w-7 h-7 rounded-full bg-rose-600 flex items-center justify-center text-xs font-bold shrink-0">!</div>
            <div class="chat-bubble-ai p-3 text-xs text-rose-300">حدث خطأ في الاتصال بالسيرفر. يرجى المحاولة لاحقاً.</div>
          </div>
        `;
      }
      container.scrollTop = container.scrollHeight;
    }

    function speakInput(lang) {
      const val = document.getElementById('speechText').value;
      if(!val) return;
      const msg = new SpeechSynthesisUtterance(val);
      msg.lang = lang === 'ar' ? 'ar-SA' : 'en-US';
      window.speechSynthesis.speak(msg);
    }

    function clearChat() {
      document.getElementById('chatContainer').innerHTML = `
        <div class="flex gap-2 items-start">
          <div class="w-7 h-7 rounded-full bg-blue-600 flex items-center justify-center text-xs font-bold shrink-0">AI</div>
          <div class="chat-bubble-ai p-3 text-xs text-slate-200 max-w-[85%] leading-relaxed">تم مسح المحادثة. يمكنك بدء سؤال جديد الآن!</div>
        </div>
      `;
    }
  </script>
</body>
</html>
