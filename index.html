<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DogWalk Pro | خدمات رعاية ومشاة الكلاب الاحترافية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="pb-12">

    <!-- Header -->
    <header class="bg-slate-900/90 border-b border-slate-800 p-4 sticky top-0 z-40 backdrop-blur">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="text-xl font-black text-white">DogWalk <span class="text-indigo-400">PRO</span> 🐕</h1>
            <button onclick="openAdminModal()" class="bg-slate-800 text-xs text-indigo-300 px-3 py-1.5 rounded-xl border border-indigo-500/30 flex items-center gap-1.5 cursor-pointer">
                <i class="fa-solid fa-shield-halved"></i> الإدارة
            </button>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-6">

        <!-- Auth Section -->
        <div id="authCard" class="glass-card p-5 rounded-3xl space-y-3">
            <h2 class="font-bold text-sm text-indigo-300">📱 تسجيل الدخول وإثبات الموبايل (SMS)</h2>
            <select id="userRole" class="w-full bg-slate-800 border border-slate-700 p-2.5 rounded-xl text-xs text-white">
                <option value="client">عميل (أطلب مشي لكلبي)</option>
                <option value="walker">كابتن (انضمام لفريق العمل)</option>
            </select>
            <input type="tel" id="phoneInput" value="+20" placeholder="+2010xxxxxxx" class="w-full bg-slate-800 border border-slate-700 p-2.5 rounded-xl text-xs text-white text-left" dir="ltr">
            <button onclick="sendSMS()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold p-3 rounded-xl text-xs cursor-pointer">إرسال رمز الأمان SMS</button>

            <div id="otpSection" class="hidden space-y-2 pt-2 border-t border-slate-700">
                <input type="text" id="otpInput" placeholder="أدخل كود الـ SMS هنا" class="w-full bg-slate-800 border border-slate-700 p-2.5 rounded-xl text-xs text-white text-center font-bold tracking-widest">
                <button onclick="verifySMS()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold p-2.5 rounded-xl text-xs cursor-pointer">تأكيد الرمز والدخول</button>
            </div>
        </div>

        <!-- Advanced Pricing & Booking Form -->
        <div id="bookingCard" class="hidden glass-card p-5 rounded-3xl space-y-3">
            <h2 class="font-bold text-sm text-indigo-300">📊 حاسبة الباقات وطلب جولة جديدة</h2>
            
            <input type="text" id="cName" placeholder="الاسم بالكامل" class="w-full bg-slate-800 border border-slate-700 p-2.5 rounded-xl text-xs text-white">
            <input type="text" id="cAddr" placeholder="العنوان بالتفصيل" class="w-full bg-slate-800 border border-slate-700 p-2.5 rounded-xl text-xs text-white">
            <input type="text" id="cDog" placeholder="نوع / اسم الكلب" class="w-full bg-slate-800 border border-slate-700 p-2.5 rounded-xl text-xs text-white">

            <div>
                <label class="text-[11px] text-slate-300 block mb-1">حجم الكلب:</label>
                <select id="dogSize" onchange="calculatePlan()" class="w-full bg-slate-800 border border-slate-700 p-2 rounded-xl text-xs text-white">
                    <option value="1">صغير (500 EGP/ساعة)</option>
                    <option value="1.2">متوسط (600 EGP/ساعة)</option>
                    <option value="1.5">كبير جداً (750 EGP/ساعة)</option>
                </select>
            </div>

            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="text-[11px] text-slate-300 block mb-1">عدد الساعات:</label>
                    <input type="number" id="cHours" value="1" min="1" max="6" onchange="calculatePlan()" class="w-full bg-slate-800 border border-slate-700 p-2 rounded-xl text-xs text-white text-center">
                </div>
                <div>
                    <label class="text-[11px] text-slate-300 block mb-1">خدمات إضافية:</label>
                    <label class="flex items-center gap-1.5 text-[11px] text-slate-300 pt-1.5">
                        <input type="checkbox" id="extGroom" onchange="calculatePlan()" class="accent-indigo-600"> تنظيف (+150ج)
                    </label>
                </div>
            </div>

            <div class="bg-amber-500/10 border border-amber-500/30 p-2 rounded-xl text-[11px] text-amber-200">
                الدفع عبر فودافون كاش / InstaPay على: <b class="text-white">01030145357</b>
            </div>

            <div class="flex justify-between items-center font-bold text-sm pt-1 border-t border-slate-700">
                <span>الإجمالي النهائي:</span>
                <span id="totalVal" class="text-emerald-400 text-base">500 EGP</span>
            </div>

            <button onclick="submitOrder()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold p-3 rounded-xl text-xs cursor-pointer">تأكيد وإرسال الطلب</button>
        </div>

        <!-- Track & Live ETA Card -->
        <div id="trackCard" class="hidden space-y-3">
            <div id="liveEtaCard" class="hidden bg-indigo-950/80 border border-indigo-500/40 p-3 rounded-2xl text-center space-y-1">
                <div class
