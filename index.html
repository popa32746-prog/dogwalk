<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DogWalk Pro | خدمات رعاية ومشاة الكلاب</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="pb-12">

    <header class="bg-indigo-900 p-6 text-center border-b border-indigo-700">
        <h1 class="text-3xl font-black text-white">DogWalk <span class="text-indigo-400">PRO</span> 🐕</h1>
        <p class="text-xs text-indigo-200 mt-1">خدمات رعاية ومشاة الكلاب الاحترافية (500 EGP / ساعة)</p>
        <button onclick="openAdmin()" class="mt-3 bg-slate-800 text-xs text-indigo-300 px-3 py-1.5 rounded-xl border border-indigo-500/30">تسجيل دخول الإدارة (Admin)</button>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-6">

        <!-- تسجيل الدخول -->
        <div id="authCard" class="glass-card p-5 rounded-3xl space-y-3">
            <h2 class="font-bold text-sm text-indigo-300">📱 تسجيل الدخول وإرسال رمز الأمان SMS</h2>
            <select id="roleSelect" class="w-full bg-slate-800 border border-slate-700 p-2.5 rounded-xl text-xs text-white">
                <option value="client">عميل (أطلب مشي لكلبي)</option>
                <option value="walker">كابتن (انضمام لفريق العمل)</option>
            </select>
            <input type="tel" id="phoneInput" value="+20" placeholder="+2010xxxxxxx" class="w-full bg-slate-800 border border-slate-700 p-2.5 rounded-xl text-xs text-white text-left" dir="ltr">
            <button onclick="sendSMS()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold p-3 rounded-xl text-xs cursor-pointer">إرسال رمز الأمان SMS</button>

            <div id="otpSection" class="hidden space-y-2 pt-2 border-t border-slate-700">
                <input type="text" id="otpInput" placeholder="أدخل كود الـ SMS هنا" class="w-full bg-slate-800 border border-slate-700 p-2.5 rounded-xl text-xs text-white text-center font-bold">
                <button onclick="verifySMS()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold p-2.5 rounded-xl text-xs cursor-pointer">تأكيد الرمز والدخول</button>
            </div>
        </div>

        <!-- طلب حجز -->
        <div id="bookingCard" class="hidden glass-card p-5 rounded-3xl space-y-3">
            <h2 class="font-bold text-sm text-indigo-300">📝 طلب حجز موعد جديد</h2>
            <input type="text" id="cName" placeholder="الاسم بالكامل" class="w-full bg-slate-800 border border-slate-700 p-2.5 rounded-xl text-xs text-white">
            <input type="text" id="cAddr" placeholder="العنوان بالتفصيل" class="w-full bg-slate-800 border border-slate-700 p-2.5 rounded-xl text-xs text-white">
            <input type="text" id="cDog" placeholder="نوع/اسم الكلب" class="w-full bg-slate-800 border border-slate-700 p-2.5 rounded-xl text-xs text-white">
            <div class="flex justify-between
